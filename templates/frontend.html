<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f7">
  <meta name="description" content="SmartPark — Intelligent Parking Management System.">
  <title>SmartPark — Parking made simple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* Theme and shared components */
:root {
  --ink:#152a23;
  --muted:#718078;
  --line:#e4eae6;
  --canvas:#f5f8f6;
  --green:#167653;
  --green-dark:#105d40;
  --mint:#e4f3eb;
  --lime:#d1f36a;
  --amber:#fff4df;
  --red:#fae9e7;
  --shadow:0 14px 36px rgba(20,50,39,.08);
  --radius:16px;
}
* {
  box-sizing:border-box;
}
body {
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font-family:'DM Sans',Arial,sans-serif;
  font-size:14px;
}
button,input,select {
  font:inherit;
}
button {
  cursor:pointer;
}
.topbar {
  height:74px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 max(5vw,24px);
  position:sticky;
  top:0;
  z-index:5;
}
.brand {
  display:flex;
  align-items:center;
  gap:11px;
  cursor:pointer;
}
.brand-mark {
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:var(--green);
  color:#fff;
  font-size:21px;
}
.brand-name {
  font:800 18px Manrope,sans-serif;
  letter-spacing:-.7px;
}
.brand-name span {
  color:var(--green);
}
.brand-caption {
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.7px;
  text-transform:uppercase;
  margin-top:2px;
}
.top-actions {
  display:flex;
  align-items:center;
  gap:12px;
}
.location-chip,.role-chip {
  border:1px solid var(--line);
  border-radius:99px;
  padding:9px 13px;
  color:#567066;
  background:#fff;
  font-size:12px;
}
.location-chip b {
  color:var(--green);
}
.role-chip {
  background:#eff5f1;
  color:var(--green);
  font-weight:700;
}
.provider-header {
  background:#f4f1e4;
  color:#786c34;
}
.avatar {
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--lime);
  display:grid;
  place-items:center;
  font-weight:800;
}
.page {
  max-width:1180px;
  margin:0 auto;
  padding:40px 24px 68px;
}
.page-head {
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:27px;
  gap:20px;
}
.eyebrow {
  color:var(--green);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1.35px;
  margin:0 0 9px;
}
.page h1,.hero h1 {
  font:800 clamp(30px,4vw,46px)/1.1 Manrope,sans-serif;
  letter-spacing:-1.8px;
  margin:0;
}
.subhead {
  color:var(--muted);
  margin:10px 0 0;
  font-size:15px;
}
.hero {
  max-width:1000px;
  margin:0 auto;
  padding:64px 24px 45px;
  display:grid;
  grid-template-columns:1fr;
  gap:32px;
  align-items:center;
}
.hero h1 {
  font-size:clamp(44px,5.2vw,64px);
  letter-spacing:-2.5px;
}
.hero h1 em {
  font-style:normal;
  color:var(--green);
}
.hero-copy {
  max-width:490px;
  color:#66756e;
  font-size:16px;
  line-height:1.75;
  margin:20px 0 25px;
}
.location-note {
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--muted);
  font-size:12px;
  margin-top:16px;
}
.pulse {
  width:8px;
  height:8px;
  border-radius:50%;
  background:#d0a34b;
}
.role-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:28px;
}
.role-card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:23px;
  text-align:left;
  transition:.2s;
  box-shadow:0 4px 18px #122c200c;
  color:var(--ink);
}
.role-card:hover {
  transform:translateY(-3px);
  border-color:#a8cfb6;
  box-shadow:var(--shadow);
}
.role-icon {
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  background:var(--mint);
  border-radius:14px;
  color:var(--green);
  font-size:23px;
  margin-bottom:17px;
}
.role-card.provider .role-icon {
  background:#f0eddf;
  color:#817536;
}
.role-card strong {
  font:700 17px Manrope,sans-serif;
  display:block;
}
.role-card p {
  color:var(--muted);
  line-height:1.55;
  margin:8px 0 17px;
}
.card-cta {
  color:var(--green);
  font-weight:700;
}
.stats-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:24px;
}
.stat-card,.panel,.spot-card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 4px 15px #15372808;
}
.stat-card {
  padding:18px 20px;
}
.stat-label {
  font-size:12px;
  color:var(--muted);
}
.stat-value {
  font:800 26px Manrope,sans-serif;
  letter-spacing:-.8px;
  margin-top:8px;
}
.stat-foot {
  color:#85928b;
  font-size:11px;
  margin-top:3px;
}
.stat-value.green {
  color:var(--green);
}
.toolbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:21px 0;
}
.tabs {
  display:flex;
  background:#edf1ee;
  padding:4px;
  border-radius:12px;
  gap:3px;
}
.tab {
  border:0;
  background:transparent;
  color:#74817a;
  border-radius:9px;
  padding:9px 13px;
  font-size:12px;
  font-weight:600;
}
.tab.active {
  background:#fff;
  color:var(--ink);
  box-shadow:0 1px 4px #142b201a;
}
.btn {
  border:0;
  border-radius:10px;
  padding:11px 15px;
  background:var(--green);
  color:#fff;
  font-weight:700;
  transition:.15s;
}
.btn:hover {
  background:var(--green-dark);
  transform:translateY(-1px);
}
.btn.secondary {
  background:#eef4f0;
  color:var(--green);
}
.btn.secondary:hover {
  background:#e1eee6;
}
.btn.outline {
  background:#fff;
  border:1px solid var(--line);
  color:var(--ink);
}
.btn.small {
  padding:8px 11px;
  font-size:12px;
}
.btn.danger {
  background:var(--red);
  color:#a43b34;
}
.search-row {
  display:grid;
  grid-template-columns:minmax(220px,1fr) 180px 180px auto;
  gap:10px;
  background:#fff;
  border:1px solid var(--line);
  padding:12px;
  border-radius:15px;
  margin:22px 0;
}
.field {
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 12px;
  background:#fff;
  color:var(--ink);
  outline:none;
}
.field:focus {
  border-color:#83b69a;
  box-shadow:0 0 0 3px #16765314;
}
.search-wrap {
  position:relative;
}
.search-wrap .field {
  padding-left:37px;
}
.search-icon {
  position:absolute;
  left:13px;
  top:10px;
  color:#9aa59f;
}
.spot-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}
.spot-card {
  overflow:hidden;
  transition:.18s;
}
.spot-card:hover {
  box-shadow:var(--shadow);
  transform:translateY(-2px);
}
.spot-image {
  height:136px;
  position:relative;
  background:linear-gradient(140deg,#dfeae2,#c4d8cc);
  overflow:hidden;
}
.spot-image:before {
  content:'';
  position:absolute;
  width:180%;
  height:60px;
  top:42px;
  left:-40%;
  background:#f9fbf9;
  transform:rotate(-14deg);
}
.spot-image:after {
  content:'P';
  position:absolute;
  right:18px;
  top:17px;
  width:34px;
  height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  border:2px solid #fff;
  color:#fff;
  font-size:18px;
  font-weight:700;
  background:#167653aa;
}
.lot-lines {
  position:absolute;
  left:15%;
  right:10%;
  bottom:0;
  height:51px;
  display:flex;
  gap:9px;
  align-items:flex-end;
  z-index:1;
}
.lot-lines i {
  flex:1;
  border:1px solid #9eb5a5;
  border-bottom:0;
  height:39px;
  transform:skew(-10deg);
}
.lot-car {
  position:absolute;
  z-index:2;
  left:41%;
  bottom:6px;
  color:#35745b;
  font-size:30px;
}
.badge {
  display:inline-flex;
  align-items:center;
  gap:6px;
  border-radius:99px;
  padding:6px 9px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.badge.available,.badge.confirmed {
  background:var(--mint);
  color:var(--green);
}
.badge.occupied,.badge.pending {
  background:var(--amber);
  color:#a66b1e;
}
.badge.booked {
  background:#e9edff;
  color:#4d5eae;
}
.spot-image .badge {
  position:absolute;
  left:12px;
  top:12px;
  z-index:3;
  background:#fff;
}
.spot-body {
  padding:17px;
}
.spot-title-row {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.spot-title {
  font:700 15px Manrope,sans-serif;
}
.spot-location {
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}
.spot-price {
  font:800 19px Manrope,sans-serif;
  white-space:nowrap;
}
.spot-price small {
  font:400 11px 'DM Sans',sans-serif;
  color:var(--muted);
}
.spot-meta {
  display:flex;
  gap:13px;
  margin:15px 0;
  color:#64736b;
  font-size:11px;
}
.spot-footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid var(--line);
  padding-top:13px;
}
.panel {
  padding:21px;
}
.panel h2 {
  font:700 17px Manrope,sans-serif;
  margin:0;
}
.panel-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}
.table-wrap {
  overflow:auto;
}
table {
  width:100%;
  border-collapse:collapse;
  text-align:left;
}
th {
  font-size:10px;
  color:#89958e;
  text-transform:uppercase;
  letter-spacing:.6px;
  font-weight:700;
  padding:12px 10px;
  border-bottom:1px solid var(--line);
}
td {
  padding:14px 10px;
  border-bottom:1px solid #f0f2f1;
  font-size:12px;
}
tr:last-child td {
  border-bottom:0;
}
.td-title {
  font-weight:700;
}
.td-muted {
  color:var(--muted);
  margin-top:4px;
  font-size:11px;
}
.section-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:17px;
}
.provider-toolbar {
  display:flex;
  gap:8px;
}
.slot-list {
  display:grid;
  gap:10px;
}
.slot-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:13px;
}
.slot-info {
  display:flex;
  align-items:center;
  gap:12px;
}
.slot-icon {
  width:38px;
  height:38px;
  border-radius:12px;
  background:#f0f4f1;
  display:grid;
  place-items:center;
  font-size:18px;
}
.slot-name {
  font-weight:700;
  font-size:13px;
}
.slot-sub {
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}
.slot-actions {
  display:flex;
  align-items:center;
  gap:8px;
}
.empty-state {
  text-align:center;
  padding:48px 20px;
  color:var(--muted);
}
.empty-state strong {
  display:block;
  color:var(--ink);
  font:700 17px Manrope,sans-serif;
  margin:10px;
}
.empty-icon {
  font-size:32px;
}
.modal-backdrop {
  position:fixed;
  inset:0;
  z-index:10;
  background:#14282070;
  display:grid;
  place-items:center;
  padding:18px;
  backdrop-filter:blur(3px);
}
.modal {
  width:min(520px,100%);
  background:#fff;
  border-radius:20px;
  box-shadow:0 25px 90px #10281d40;
  padding:24px;
  max-height:90vh;
  overflow:auto;
  animation:pop .18s ease-out;
}
@keyframes pop {
  from {
    transform:translateY(7px);
    opacity:.6;
  }
  to {
    transform:none;
    opacity:1;
  }
}
.modal-head {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:20px;
}
.modal-head h2 {
  font:800 21px Manrope,sans-serif;
  margin:0;
}
.modal-head p {
  color:var(--muted);
  font-size:12px;
  margin:6px 0 0;
}
.close-btn {
  border:0;
  background:#f0f3f1;
  border-radius:9px;
  width:32px;
  height:32px;
  color:#637168;
  font-size:18px;
}
.form-stack {
  display:grid;
  gap:14px;
}
.form-label {
  display:block;
  font-size:11px;
  font-weight:700;
  color:#66736c;
  margin-bottom:7px;
}
.form-two {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.checkout-total {
  background:#f2f6f3;
  border-radius:13px;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:17px 0;
}
.checkout-total strong {
  font:800 22px Manrope,sans-serif;
}
.payment-method {
  display:flex;
  gap:9px;
}
.pay-option {
  flex:1;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  background:#fff;
  text-align:left;
  font-size:12px;
}
.pay-option.selected {
  border-color:var(--green);
  background:#f0f7f2;
}
.receipt {
  border:1px dashed #b9ccc0;
  border-radius:14px;
  padding:18px;
  background:#fbfdfb;
}
.receipt-brand {
  display:flex;
  align-items:center;
  gap:9px;
  font:800 16px Manrope,sans-serif;
  color:var(--green);
}
.receipt-id {
  font:700 11px monospace;
  color:#6f7c74;
}
.receipt-total {
  display:flex;
  justify-content:space-between;
  border-top:1px solid var(--line);
  padding-top:13px;
  margin-top:13px;
  font-weight:700;
}
.receipt-line {
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  font-size:12px;
}
.receipt-line span:first-child {
  color:var(--muted);
}
.toast-region {
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:20;
  display:grid;
  gap:9px;
}
.toast {
  background:#16382a;
  color:#fff;
  padding:12px 16px;
  border-radius:12px;
  box-shadow:var(--shadow);
  font-size:12px;
  animation:pop .2s ease-out;
}
.footer-note {
  border-top:1px solid var(--line);
  padding:18px 24px;
  text-align:center;
  color:#87938c;
  font-size:11px;
}
.footer-note strong {
  color:#62756b;
}
.receipt-actions {
  display:flex;
  gap:9px;
  margin-top:15px;
}
.full {
  width:100%;
}
.vehicle-card {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
}
.vehicle-plate {
  font:800 13px Manrope,sans-serif;
  letter-spacing:.8px;
}
.vehicle-type {
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}
.tiny {
  font-size:11px;
  color:var(--muted);
}
@media(max-width:850px) {
  .hero {
    grid-template-columns:1fr;
    gap:30px;
    padding-top:42px;
  }
  .spot-grid {
    grid-template-columns:repeat(2,1fr);
  }
  .stats-grid {
    grid-template-columns:repeat(2,1fr);
  }
  .search-row {
    grid-template-columns:1fr 1fr;
  }
  .search-row .search-wrap {
    grid-column:span 2;
  }
  .section-grid {
    grid-template-columns:1fr;
  }
}
@media(max-width:560px) {
  .topbar {
    height:66px;
    padding:0 16px;
  }
  .location-chip {
    display:none;
  }
  .page {
    padding:30px 16px 48px;
  }
  .hero {
    padding:42px 16px 30px;
  }
  .hero h1 {
    font-size:43px;
  }
  .role-grid {
    grid-template-columns:1fr;
  }
  .spot-grid {
    grid-template-columns:1fr;
  }
  .search-row {
    grid-template-columns:1fr;
  }
  .search-row .search-wrap {
    grid-column:auto;
  }
  .page-head {
    align-items:flex-start;
    flex-direction:column;
  }
  .provider-toolbar {
    width:100%;
  }
  .provider-toolbar .btn {
    flex:1;
  }
  .toolbar {
    align-items:flex-start;
    flex-direction:column;
  }
  .tabs {
    max-width:100%;
    overflow:auto;
  }
  .tab {
    white-space:nowrap;
  }
  .form-two {
    grid-template-columns:1fr;
  }
  .top-actions {
    gap:7px;
  }
  .role-chip {
    font-size:10px;
    padding:8px;
  }
  .stat-card {
    padding:14px;
  }
  .stat-value {
    font-size:22px;
  }
  .slot-row {
    align-items:flex-start;
  }
  .slot-actions {
    flex-direction:column;
    align-items:flex-end;
  }
}
.auth-page {
  min-height:calc(100vh - 140px);
  display:grid;
  place-items:center;
  padding:44px 20px;
  background:radial-gradient(ellipse at 50% 0%,#e4f3eb 0,transparent 55%);
}
.auth-card {
  width:min(460px,100%);
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:30px;
  box-shadow:var(--shadow);
}
.auth-heading {
  text-align:center;
  margin-bottom:22px;
}
.auth-heading .role-icon {
  margin:0 auto 15px;
}
.auth-heading .eyebrow {
  margin-bottom:8px;
}
.auth-heading h1 {
  font:800 28px Manrope,sans-serif;
  letter-spacing:-.8px;
  margin:0;
}
.auth-heading p:last-child {
  color:var(--muted);
  margin:9px 0 0;
}
.auth-switch {
  display:flex;
  background:#eef3ef;
  padding:4px;
  border-radius:11px;
  margin:20px 0;
}
.auth-switch .tab {
  flex:1;
}
.auth-footnote {
  text-align:center;
  font-size:11px;
  line-height:1.5;
  color:var(--muted);
  margin:16px 0 0;
}
.auth-card .form-stack {
  gap:13px;
}
@media(max-width:560px) {
  .auth-page {
    padding:28px 15px;
  }
  .auth-card {
    padding:23px;
    border-radius:18px;
  }
  .auth-heading h1 {
    font-size:25px;
  }
}
:focus-visible {
  outline:3px solid #83b69a;
  outline-offset:3px;
}
.brand {
  cursor:pointer;
}
.hero {
  max-width:1180px;
  min-height:calc(100vh - 150px);
  grid-template-columns:1.05fr .95fr;
  gap:56px;
  padding-top:52px;
}
.hero:before {
  content:'P';
  grid-column:2;
  grid-row:1;
  display:grid;
  place-items:center;
  min-height:340px;

const fd=new FormData(e.target),email=String(fd.get('email')).trim().toLowerCase(),password=String(fd.get('password'));

return}
if(authMode==='register'){
  if(password!==fd.get('confirmPassword')){toast('The passwords do not match');return}
  try {
    const res=await fetch('/api/register', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        name:String(fd.get('name')||'').trim(),
        email,
        phone:String(fd.get('phone')||'').trim(),
        password,
        role
      })
    });
    const data=await res.json();
    if(data.success){
      state.currentUser=data.user;
      toast('Account created and saved to SQLite');
      authMode='workspace';
      await syncWithBackend();
      render();
    } else {
      toast(data.message||'Registration failed');

  } catch(err){
    toast('Server connection failed: '+err.message);

  try {
    const res=await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email, password, role})
    });

}

async function confirmBooking(e,id){e.preventDefault();
const s=allSpaces().find(x=>x.id===id);
if(!s||s.available<1){toast('Sorry, this parking facility has no available slots');
closeModal();
render();
return}
const fd=new FormData(e.target);
const v=state.vehicles.find(x=>x.id===fd.get('vehicle'));
const hours=Number(fd.get('duration'));
const start=fd.get('start');
const date=fd.get('date');
if(!v){toast('Select a registered vehicle');return}
if(!date||date<new Date().toISOString().slice(0,10)){toast('Choose today or a future date');return}
const [hh,mm]=start.split(':').map(Number);
const end=new Date(2000,0,1,hh+hours,mm).toTimeString().slice(0,5);

toast('Request enqueued in OS FCFS Queue...');

try {
  const res = await fetch('/api/book', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      user_id: state.currentUser?.userId || 1,
      space_id: s.id,
      driver_name: state.currentUser?.name || 'Driver',
      plate: v.plate,
      vehicle_model: v.model,
      date: date,
      start: start,
      end: end,
      hours: hours,
      amount: s.price * hours,
      method: paymentMethod
    })
  });
  const data = await res.json();
  if(data.success){
    state.bookings.unshift(data.booking);
    await syncWithBackend();
    modal={type:'receipt',bookingId:data.booking.id,success:true};
    render();
    renderModal();
    toast(`Confirmed! Allocated physical slot ${data.booking.slotNumber} via FAS.`);
  } else {
    toast('Booking rejected: ' + (data.message || 'Error occurred'));
    closeModal();
    await syncWithBackend();
  }
} catch(err) {
  toast('Network error during booking');
}}

// OS & DBMS Concept Demonstration Modal
function openOsSimModal(){modal={type:'os_sim'};renderModal()}
function osSimModal(){return `${modalHead('Operating Systems & DBMS Architecture','Academic Demonstration for 3rd-Year B.Tech CSE')}<div class="receipt" style="max-height:480px;overflow-y:auto;text-align:left">
<div style="background:#e4f3eb;padding:12px;border-radius:10px;margin-bottom:15px;color:#105d40">
  <strong>1. OS Algorithm 1 (FCFS Queue):</strong> Incoming booking requests are queued in a thread-safe <code>queue.Queue</code> and processed in strict arrival order by a worker dispatcher.<br><br>
  <strong>2. OS Algorithm 2 (FAS Allocation):</strong> Physical parking slots are scanned in ascending order (<code>ORDER BY slot_id ASC</code>) and the First Available Slot is allocated.<br><br>
  <strong>3. Concurrency Safeguard:</strong> SQLite <code>BEGIN IMMEDIATE TRANSACTION</code> and atomic conditional update (<code>WHERE status='Available'</code>) prevents double bookings.
</div>
<div style="margin-bottom:15px">
  <button class="btn full" onclick="runCpuSimUI()">▶ Execute FCFS CPU Scheduling Simulation</button>
</div>
<div id="osSimResult" style="font-family:monospace;font-size:12px"></div>
</div>
<div class="receipt-actions">
<button class="btn full" onclick="closeModal()">Close</button>
</div>`}

async function runCpuSimUI(){
  const box = document.querySelector('#osSimResult');
  if(!box) return;
  box.innerHTML = 'Computing FCFS Gantt chart and waiting times...';
  try {
    const res = await fetch('/api/simulate-fcfs');
    const data = await res.json();
    if(data.success){
      let table = `
        <table style="width:100%;border-collapse:collapse;margin-top:10px;text-align:center">
          <thead>
            <tr style="background:#152a23;color:#fff">
              <th style="padding:6px">Process</th>
              <th>Arrival (AT)</th>
              <th>Burst (BT)</th>
              <th>Completion (CT)</th>
              <th>Turnaround (TAT)</th>
              <th>Waiting (WT)</th>
            </tr>
          </thead>
          <tbody>
      `;
      data.processes.forEach(p => {
        table += `
          <tr style="border-bottom:1px solid #e4eae6">
            <td style="padding:6px;font-weight:700">${p.pid}</td>
            <td>${p.arrival_time} ms</td>
            <td>${p.burst_time} ms</td>
            <td>${p.completion_time} ms</td>
            <td>${p.turnaround_time} ms</td>
            <td style="color:#167653;font-weight:700">${p.waiting_time} ms</td>
          </tr>
        `;
      });
      table += `
          </tbody>
        </table>
        <div style="margin-top:10px;background:#f5f8f6;padding:10px;border-radius:8px">
          <strong>Average Turnaround Time:</strong> ${data.avg_turnaround_time} ms<br>
          <strong>Average Waiting Time:</strong> ${data.avg_waiting_time} ms
        </div>
      `;
      box.innerHTML = table;
    }
  } catch(err){
    box.innerHTML = 'Failed to load simulation: '+err.message;
  }
}

// Global synchronization with SQLite backend
async function syncWithBackend(){
  try {
    const sRes = await fetch('/api/spaces');
    const sData = await sRes.json();
    if(sData.success){
      state.spaces = sData.spaces;
      state.providerSpaces = sData.providerSpaces;
    }
    const bRes = await fetch('/api/bookings');
    const bData = await bRes.json();
    if(bData.success){
      state.bookings = bData.bookings;
    }
    const vRes = await fetch('/api/vehicles');
    const vData = await vRes.json();
    if(vData.success){
      state.vehicles = vData.vehicles;
    }
    render();
  } catch(e){
    console.log('[SmartPark] Local cache active:', e);
  }
}

// Initial boot
render();
syncWithBackend();
